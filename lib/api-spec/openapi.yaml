openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Mystery shopper management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Admin dashboard metrics
  - name: stores
    description: Store management
  - name: shoppers
    description: Shopper management and verification
  - name: tasks
    description: Visit task management
  - name: questionnaires
    description: Questionnaire management
  - name: settings
    description: Browser-scoped display preferences
  - name: auth
    description: Sessions, registration and account security
  - name: users
    description: Administrator-managed accounts and role assignment
  - name: submissions
    description: Shopper reports, answers and evidence
  - name: reviews
    description: Reviewer queue and quality decisions
  - name: shopper
    description: Mystery shopper workspace
  - name: regional
    description: Regional brand executive analytics
  - name: organization
    description: Organization profile
  - name: preferences
    description: Per-account display and notification preferences
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      security: []
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /settings/preferences:
    get:
      operationId: getSettingsPreferences
      tags: [settings]
      security: []
      summary: Get browser-scoped display preferences
      responses:
        "200":
          description: Preferences saved for this browser
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsPreferences" }
    put:
      operationId: updateSettingsPreferences
      tags: [settings]
      summary: Save browser-scoped display preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsPreferencesInput" }
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsPreferences" }
        "400": { description: Invalid preferences }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get admin dashboard metrics
      responses:
        "200":
          description: Dashboard metrics and recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /stores:
    get:
      operationId: getStores
      tags: [stores]
      summary: List stores
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: region
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/StoreStatus" }
      responses:
        "200":
          description: Store list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Store" }
    post:
      operationId: createStore
      tags: [stores]
      summary: Create a store
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreInput" }
      responses:
        "201":
          description: Created store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "409": { description: Store code already exists }
  /stores/{storeId}:
    parameters:
      - name: storeId
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getStore
      tags: [stores]
      summary: Get store details
      responses:
        "200":
          description: Store details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "404": { description: Store not found }
    patch:
      operationId: updateStore
      tags: [stores]
      summary: Update a store
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreUpdate" }
      responses:
        "200":
          description: Updated store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "404": { description: Store not found }
        "409": { description: Store code already exists }
    delete:
      operationId: deleteStore
      tags: [stores]
      summary: Delete a store
      responses:
        "204": { description: Store deleted }
        "404": { description: Store not found }
        "409": { description: Store has assigned tasks }
  /shoppers:
    get:
      operationId: getShoppers
      tags: [shoppers]
      summary: List mystery shoppers
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: verificationStatus
          in: query
          schema: { $ref: "#/components/schemas/VerificationStatus" }
        - name: accountStatus
          in: query
          schema: { $ref: "#/components/schemas/AccountStatus" }
      responses:
        "200":
          description: Shopper list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Shopper" }
    post:
      operationId: createShopper
      tags: [shoppers]
      summary: Register a mystery shopper
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopperInput" }
      responses:
        "201":
          description: Created shopper
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shopper" }
        "409": { description: Email already exists }
  /shoppers/{shopperId}:
    parameters:
      - name: shopperId
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getShopper
      tags: [shoppers]
      summary: Get shopper details
      responses:
        "200":
          description: Shopper details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shopper" }
        "404": { description: Shopper not found }
    patch:
      operationId: updateShopper
      tags: [shoppers]
      summary: Update shopper profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShopperUpdate" }
      responses:
        "200":
          description: Updated shopper
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shopper" }
        "404": { description: Shopper not found }
        "409": { description: Email already exists }
  /shoppers/{shopperId}/verification:
    post:
      operationId: decideShopperVerification
      tags: [shoppers]
      summary: Approve or reject a shopper
      parameters:
        - name: shopperId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerificationDecisionInput" }
      responses:
        "200":
          description: Recorded verification decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shopper" }
        "404": { description: Shopper not found }
  /tasks:
    get:
      operationId: getTasks
      tags: [tasks]
      summary: List visit tasks
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/TaskStatus" }
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create and optionally assign a visit task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { description: Invalid dates or ineligible shopper assignment }
        "404": { description: Store or shopper not found }
  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get task details
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { description: Task not found }
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskUpdate" }
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { description: Invalid dates or ineligible shopper assignment }
        "404": { description: Task not found }
  /questionnaires:
    get:
      operationId: getQuestionnaires
      tags: [questionnaires]
      summary: List questionnaires
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/QuestionnaireStatus" }
      responses:
        "200":
          description: Questionnaire list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Questionnaire" }
    post:
      operationId: createQuestionnaire
      tags: [questionnaires]
      summary: Create questionnaire with questions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionnaireInput" }
      responses:
        "201":
          description: Created questionnaire
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Questionnaire" }
  /questionnaires/{questionnaireId}:
    parameters:
      - name: questionnaireId
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getQuestionnaire
      tags: [questionnaires]
      summary: Get questionnaire details
      responses:
        "200":
          description: Questionnaire with questions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Questionnaire" }
        "404": { description: Questionnaire not found }
    patch:
      operationId: updateQuestionnaire
      tags: [questionnaires]
      summary: Update questionnaire and questions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionnaireUpdate" }
      responses:
        "200":
          description: Updated questionnaire
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Questionnaire" }
        "404": { description: Questionnaire not found }
  /auth/register:
    post:
      operationId: registerShopper
      tags: [auth]
      security: []
      summary: Public self-registration for mystery shoppers only
      description: >
        Creates a mystery shopper login together with a pending shopper profile.
        Privileged roles can only be created by an administrator through /users.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterShopperInput" }
      responses:
        "201":
          description: Registered account and opened session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "400": { description: Invalid registration details }
        "409": { description: Email already registered }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      summary: Sign in and open a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Session opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { description: Invalid credentials or deactivated account }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204": { description: Session ended }
  /auth/me:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Current signed-in account
      responses:
        "200":
          description: The signed-in account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "401": { description: Not signed in }
    patch:
      operationId: updateAuthProfile
      tags: [auth]
      summary: Update the signed-in account profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileInput" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "400": { description: Invalid profile details }
        "409": { description: Email already in use }
  /auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the signed-in account password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordInput" }
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { description: Current password is wrong or the new one is too weak }
  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: List accounts (administrator only)
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/UserRole" }
        - name: accountStatus
          in: query
          schema: { $ref: "#/components/schemas/AccountStatus" }
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "403": { description: Administrator access required }
    post:
      operationId: createUser
      tags: [users]
      summary: Create an administrator, reviewer or regional executive account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: Invalid account details }
        "409": { description: Email already in use }
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: integer }
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update role, status, region or credentials
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: Invalid account details }
        "404": { description: Account not found }
        "409": { description: Email already in use }
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete an account
      responses:
        "204": { description: Account deleted }
        "400": { description: The last active administrator cannot be deleted }
        "404": { description: Account not found }
  /shopper/overview:
    get:
      operationId: getShopperOverview
      tags: [shopper]
      summary: Dashboard metrics for the signed-in mystery shopper
      responses:
        "200":
          description: Shopper dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopperOverview" }
        "403": { description: Mystery shopper access required }
  /submissions:
    get:
      operationId: getSubmissions
      tags: [submissions]
      summary: List reports visible to the current role
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SubmissionStatus" }
        - name: storeId
          in: query
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubmissionSummary" }
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Start (or resume) the report for one of my assignments
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSubmissionInput" }
      responses:
        "201":
          description: Report draft ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionDetail" }
        "400": { description: The task cannot be reported on }
        "403": { description: This assignment belongs to another shopper }
        "404": { description: Task not found }
  /submissions/mine:
    get:
      operationId: getMySubmissions
      tags: [submissions]
      summary: Submission history for the signed-in shopper
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SubmissionStatus" }
      responses:
        "200":
          description: My reports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubmissionSummary" }
        "403": { description: Mystery shopper access required }
  /submissions/{submissionId}:
    parameters:
      - name: submissionId
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getSubmission
      tags: [submissions]
      summary: Report detail with answers and evidence
      responses:
        "200":
          description: Report detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionDetail" }
        "403": { description: You cannot access this report }
        "404": { description: Report not found }
  /submissions/{submissionId}/draft:
    parameters:
      - name: submissionId
        in: path
        required: true
        schema: { type: integer }
    put:
      operationId: saveSubmissionDraft
      tags: [submissions]
      summary: Save answers and comments without submitting
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveSubmissionInput" }
      responses:
        "200":
          description: Draft saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionDetail" }
        "400": { description: Invalid answers }
        "403": { description: You cannot edit this report }
        "404": { description: Report not found }
  /submissions/{submissionId}/submit:
    parameters:
      - name: submissionId
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: submitSubmission
      tags: [submissions]
      summary: Submit a report for review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveSubmissionInput" }
      responses:
        "200":
          description: Report submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionDetail" }
        "400": { description: "Missing required answers, comment or evidence" }
        "403": { description: You cannot submit this report }
        "404": { description: Report not found }
  /submissions/{submissionId}/evidence:
    parameters:
      - name: submissionId
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: addSubmissionEvidence
      tags: [submissions]
      summary: Attach a photo to a report
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceInput" }
      responses:
        "201":
          description: Evidence stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionDetail" }
        "400": { description: Unsupported file type or the file is too large }
        "403": { description: You cannot edit this report }
        "404": { description: Report not found }
  /submissions/{submissionId}/evidence/{evidenceId}:
    parameters:
      - name: submissionId
        in: path
        required: true
        schema: { type: integer }
      - name: evidenceId
        in: path
        required: true
        schema: { type: integer }
    delete:
      operationId: deleteSubmissionEvidence
      tags: [submissions]
      summary: Remove a photo from a report
      responses:
        "200":
          description: Evidence removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionDetail" }
        "403": { description: You cannot edit this report }
        "404": { description: Evidence not found }
  /submissions/{submissionId}/evidence/{evidenceId}/file:
    parameters:
      - name: submissionId
        in: path
        required: true
        schema: { type: integer }
      - name: evidenceId
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getSubmissionEvidenceFile
      tags: [submissions]
      summary: Download the stored photo
      responses:
        "200":
          description: Image bytes
          content:
            image/*:
              schema: { type: string, format: binary }
        "403": { description: You cannot access this report }
        "404": { description: Evidence not found }
  /reviews/overview:
    get:
      operationId: getReviewOverview
      tags: [reviews]
      summary: Dashboard metrics for reviewers
      responses:
        "200":
          description: Review dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewOverview" }
        "403": { description: Reviewer access required }
  /reviews/queue:
    get:
      operationId: getReviewQueue
      tags: [reviews]
      summary: Reports waiting for a review decision
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SubmissionStatus" }
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubmissionSummary" }
        "403": { description: Reviewer access required }
  /reviews/history:
    get:
      operationId: getReviewHistory
      tags: [reviews]
      summary: Reports that already received a decision
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SubmissionStatus" }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Review history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubmissionSummary" }
        "403": { description: Reviewer access required }
  /reviews/{submissionId}:
    parameters:
      - name: submissionId
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: decideReview
      tags: [reviews]
      summary: Approve, reject, request correction or mark under review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDecisionInput" }
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionDetail" }
        "400": { description: A reviewer comment is required for this outcome }
        "403": { description: Reviewer access required }
        "404": { description: Report not found }
  /regional/overview:
    get:
      operationId: getRegionalOverview
      tags: [regional]
      summary: Scorecards, trends and rankings for the executive region
      responses:
        "200":
          description: Regional dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegionalOverview" }
        "403": { description: Regional executive access required }
  /regional/scorecards:
    get:
      operationId: getRegionalScorecards
      tags: [regional]
      summary: Per-store scorecards built from approved reports only
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Store scorecards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StoreScorecard" }
        "403": { description: Regional executive access required }
  /regional/comparison:
    get:
      operationId: getRegionalComparison
      tags: [regional]
      summary: Compare stores inside the region against the network average
      responses:
        "200":
          description: Regional comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegionComparison" }
        "403": { description: Regional executive access required }
  /regional/trends:
    get:
      operationId: getRegionalTrends
      tags: [regional]
      summary: Monthly performance trend for approved reports
      parameters:
        - name: months
          in: query
          schema: { type: integer, minimum: 3, maximum: 24 }
      responses:
        "200":
          description: Monthly trend
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrendPoint" }
        "403": { description: Regional executive access required }
  /regional/export:
    get:
      operationId: exportRegionalData
      tags: [regional]
      summary: CSV export of scorecards or approved reports for the region
      parameters:
        - name: dataset
          in: query
          required: true
          schema:
            type: string
            enum: [scorecards, reports, trends]
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "403": { description: Regional executive access required }
  /organization:
    get:
      operationId: getOrganization
      tags: [organization]
      summary: Organization profile
      responses:
        "200":
          description: Organization settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSettings" }
    put:
      operationId: updateOrganization
      tags: [organization]
      summary: Update the organization profile (administrator only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationSettingsInput" }
      responses:
        "200":
          description: Updated organization settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSettings" }
        "400": { description: Invalid organization details }
        "403": { description: Administrator access required }
  /me/preferences:
    get:
      operationId: getPreferences
      tags: [preferences]
      summary: Display and notification preferences for the signed-in account
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "401": { description: Not signed in }
    put:
      operationId: updatePreferences
      tags: [preferences]
      summary: Save display and notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPreferencesInput" }
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "400": { description: Invalid preferences }
